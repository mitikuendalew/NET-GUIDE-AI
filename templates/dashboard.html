<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetGuide AI - Student Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }
        header { 
            background: #1e293b; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 1px solid #334155; 
        }
        header h1 { margin: 0; font-size: 20px; color: #38bdf8; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; }
        .admin-link { color: #38bdf8; text-decoration: none; font-weight: bold; background: rgba(56, 189, 248, 0.1); padding: 6px 12px; border-radius: 4px; border: 1px solid rgba(56, 189, 248, 0.2); }
        .admin-link:hover { background: rgba(56, 189, 248, 0.2); }
        .logout-btn { background: #ef4444; border: none; padding: 8px 16px; border-radius: 6px; color: white; cursor: pointer; font-weight: bold; font-size: 13px; }
        .logout-btn:hover { background: #dc2626; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .chat-container { flex: 1; display: flex; flex-direction: column; background: #0f172a; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .chat-box { flex: 1; overflow-y: auto; padding: 20px; background: #1e293b; border-radius: 8px; border: 1px solid #334155; margin-bottom: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; white-space: pre-wrap; font-size: 14px; }
        .message.user { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.ai { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .message.ai code, .message.ai pre {
            font-family: 'Courier New', Courier, monospace;
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            overflow-x: auto;
        }

        .input-area { display: flex; gap: 10px; }
        textarea { flex: 1; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; resize: none; height: 50px; font-family: inherit; font-size: 14px; }
        textarea:focus { outline: none; border-color: #38bdf8; }
        .send-btn { padding: 0 24px; background: #0284c7; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; }
        .send-btn:hover { background: #0369a1; }
        .send-btn:disabled { background: #475569; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <h1>NetGuide AI // Student Portal</h1>
        <div class="user-info">
            <span>Welcome, <strong>{{ username }}</strong> (<em>{{ role }}</em>)</span>
            {% if role == 'admin' %}
            <a href="/admin" class="admin-link">⚙️ Admin Panel</a>
            {% endif %}
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>
    
    <div class="main-container">
        <div class="chat-container">
            <div id="chat-box" class="chat-box">
                <div class="message ai">Hello {{ username }}! I am your Senior Network Engineering Mentor. Ask me anything about OSPF, VLSM Subnetting, VLAN trunking, or paste your Cisco IOS configurations for review.</div>
            </div>
            <div class="input-area">
                <textarea id="prompt-input" placeholder="Ask a networking question or paste config..." onkeydown="handleKey(event)"></textarea>
                <button id="send-btn" class="send-btn" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('prompt-input');
            const sendBtn = document.getElementById('send-btn');
            const chatBox = document.getElementById('chat-box');
            const prompt = input.value.trim();
            if (!prompt) return;

            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.innerText = prompt;
            chatBox.appendChild(userMsg);
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            sendBtn.disabled = true;

            const loadingMsg = document.createElement('div');
            loadingMsg.className = 'message ai';
            loadingMsg.id = 'loading-indicator';
            loadingMsg.innerText = 'Analyzing networking protocols';
            chatBox.appendChild(loadingMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            let dots = '';
            const dotInterval = setInterval(() => {
                dots = dots.length >= 3 ? '' : dots + '.';
                const indicator = document.getElementById('loading-indicator');
                if (indicator) {
                    indicator.innerText = 'Analyzing networking protocols' + dots;
                }
            }, 400);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                clearInterval(dotInterval);

                if (res.status === 401) {
                    alert('Session expired. Please log in again.');
                    window.location.href = '/login';
                    return;
                }

                const data = await res.json();
                if (chatBox.contains(loadingMsg)) {
                    chatBox.removeChild(loadingMsg);
                }

                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.innerText = res.ok ? data.response : `Error: ${data.error || 'AI generation failed.'}`;
                chatBox.appendChild(aiMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                clearInterval(dotInterval);
                if (chatBox.contains(loadingMsg)) {
                    chatBox.removeChild(loadingMsg);
                }
                const errorMsg = document.createElement('div');
                errorMsg.className = 'message ai';
                errorMsg.innerText = 'Network error connecting to Gemini AI backend.';
                chatBox.appendChild(errorMsg);
                chatBox.scrollTop = chatBox.scrollHeight;
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST' });
            } finally {
                window.location.href = '/login';
            }
        }
    </script>
</body>
</html>
